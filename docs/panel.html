<script>
'use strict';

function toggleSidebarMobile(){
  document.getElementById('sidebar').classList.toggle('sidebar-open');
  document.getElementById('sidebar-backdrop').style.display=document.getElementById('sidebar').classList.contains('sidebar-open')?'block':'none';
}
function closeSidebarMobile(){
  if(window.innerWidth>768) return;
  document.getElementById('sidebar').classList.remove('sidebar-open');
  document.getElementById('sidebar-backdrop').style.display='none';
}

function toggleAcc(id){
  var el=document.getElementById(id);
  var body=document.getElementById('body-'+id);
  var arr=document.getElementById('arr-'+id);
  var isOpen=el.classList.contains('acc-open');
  // cerrar todos
  document.querySelectorAll('[id^="acc-"]').forEach(function(e){
    if(e.id.startsWith('acc-')&&e.tagName==='DIV'){
      e.classList.remove('acc-open');
      e.style.background='#F8F6F2';e.style.opacity='.82';
      e.style.boxShadow='0 1px 3px rgba(0,0,0,.04)';e.style.borderColor='#EAE4DC';
      var b=document.getElementById('body-'+e.id);if(b)b.style.maxHeight='0';
      var a=document.getElementById('arr-'+e.id);if(a)a.style.transform='';
    }
  });
  if(!isOpen){
    el.classList.add('acc-open');
    el.style.background='#fff';el.style.opacity='1';
    el.style.boxShadow='0 6px 24px rgba(0,0,0,.10)';el.style.borderColor='#4E807D';
    body.style.maxHeight='700px';
    arr.style.transform='rotate(180deg)';
  }
}
function toggleCrit(id){
  var el=document.getElementById('crit-body-'+id);
  var ar=document.getElementById('crit-arr-'+id);
  if(!el) return;
  var open=el.style.display!=='none';
  el.style.display=open?'none':'flex';
  if(ar) ar.style.transform=open?'':'rotate(180deg)';
}

/* ─── API real (Render / Postgres) ─────────────────────────────────
   Reemplaza los google.script.run + <?= ?> del original de Apps Script.
   Campos "confirmados" abajo = existen en el modal de panel.html.
   Campos "estimados" = columnas agregadas en la migración a Postgres
   (ver claude/estado-migracion-render.md) pero admin.js puede no
   guardarlas todavía (backlog Tier 2 #8) — verificar antes de confiar
   en que persistan.
──────────────────────────────────────────────────────────────────── */
var API = "https://lebrero-web-publica.onrender.com/api";
var TOKEN = localStorage.getItem("lebrero_admin_token") || null;

function apiFetch(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ "x-admin-token": TOKEN, "Content-Type": "application/json" }, opts.headers || {});
  return fetch(API + path, opts).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(data){
      if (!res.ok) throw new Error(data.error || "Error de servidor (" + res.status + ")");
      return data;
    });
  });
}

function esc(v) { return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function isSi(v){ if(v===true||v===1) return true; var s=String(v==null?'':v).trim().toLowerCase(); return s==='si'||s==='true'||s==='1'; }
function fmtPrice(precio,moneda) { var n=Number(precio); if(!n) return '—'; return (moneda||'')+' '+n.toLocaleString('es-AR'); }
function zoneLevel(barrio,reqZonas) {
  if(reqZonas.indexOf(barrio)!==-1) return 'exact';
  var keys=Object.keys(ZONA_GROUPS);
  for(var i=0;i<keys.length;i++){var g=ZONA_GROUPS[keys[i]];if(g.indexOf(barrio)!==-1&&reqZonas.some(function(rz){return g.indexOf(rz)!==-1;}))return 'group';}
  return 'no';
}

  var blkC='<div class="card"><div style="padding:14px 20px;border-bottom:1px solid #F0EBE4;display:flex;align-items:center;gap:9px;"><div class="blk" style="background:#31455C;">C</div><div style="font-size:13px;font-weight:700;color:#1C2B39;">Ubicación</div></div><div style="padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;"><div style="grid-column:1/-1;"><label class="fl">Dirección</label>'+inputHtml('direccion','text',f.direccion,'Calle y número')+'</div><div style="grid-column:1/-1;"><label class="fl">Entre calles (opcional)</label>'+inputHtml('entreCalles','text',f.entreCalles,'Ej: Av. Santa Fe y Arenales')+'</div><div><label class="fl">Barrio</label><div style="display:flex;gap:6px;">'+datalistHtml('barrio',f.barrio,BARRIOS,'Escribir o elegir barrio')+'<button type="button" data-action="pf-nuevo-barrio" title="Agregar como barrio nuevo si no existe en la lista" style="flex-shrink:0;padding:0 12px;border-radius:7px;border:1.5px solid #E0D9D0;background:#FAFAF8;color:#5A6A7A;font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;">+ nuevo</button></div></div><div><label class="fl">Localidad</label>'+datalistHtml('localidad',f.localidad,LOCALIDADES,'Olavarría, Mar del Plata, etc.')+'</div>'+pisoDepto+'<div><label class="fl">Partida Inmobiliaria</label><div style="display:flex;gap:6px;">'+inputHtml('partida','text',f.partida,'N° partida')+'<a href="https://carto.arba.gov.ar/cartoArba/" target="_blank" class="btn-s" style="padding:8px 12px;font-size:10px;white-space:nowrap;">🔗 Cartoarba</a></div></div><div style="grid-column:1/-1;"><label class="fl">Ubicación en mapa</label><iframe width="100%" height="220" style="border:1.5px solid #E0D9D0;border-radius:7px;" loading="lazy" src="https://maps.google.com/maps?q='+mapQ+'&output=embed"></iframe></div></div></div>';

el class="fl">Observaciones</label><textarea class="ft" data-field="obs" rows="3" placeholder="Detalles adicionales...">'+esc(f.obs)+'</textarea></div></div></div>';

/* ─── RENDER REQ FORM ────────────────────────────────────────────── */
function renderReqForm(){

  var stepPct=Math.round((step/totalSteps)*100);
  var progressH='<div style="position:sticky;top:0;z-index:5;background:#F7F8FA;padding:10px 0;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;"><span style="font-size:11px;font-weight:700;color:#31455C;">Paso '+step+' de '+totalSteps+'</span></div><div style="height:6px;background:#EDE8E0;border-radius:3px;overflow:hidden;"><div style="width:'+stepPct+'%;height:100%;background:#D40A8C;border-radius:3px;transition:width .25s;"></div></div></div>';

  var TIPOS=['Casa','Departamento','Chalet','Lote','Local','Galpón','PH','Quinta','Campo','Fondo de Comercio','Cualquiera'];
  var tipoIconsH=TIPOS.map(function(t){var sel=f.tipoBuscado.indexOf(t)!==-1;return '<button type="button" data-action="tipo-icon" data-tipo="'+esc(t)+'" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:9px;border:1.5px solid '+(sel?'#31455C':'#E0D9D0')+';background:'+(sel?'#EEF1F5':'#FAFAF8')+';cursor:pointer;min-width:60px;"><span style="display:flex;">'+typeIconSvg(t,sel?(TIPO_COLORS[t]||'#31455C'):'#B0B8C1',18)+'</span><span style="font-size:9px;font-weight:600;color:'+(sel?'#31455C':'#8A9AAA')+';white-space:nowrap;">'+esc(t)+'</span></button>';}).join('');

  var OPS_LABELS={Venta:'Venta / Compra',Alquiler:'Alquiler',Ambos:'Ambos'};
var opsH=['Venta','Alquiler','Ambos'].map(function(o){var sel=f.operacion===o;return '<label style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1.5px solid '+(sel?'#31455C':'#E0D9D0')+';background:'+(sel?'#EEF1F5':'#FAFAF8')+';cursor:pointer;"><input type="radio" name="rf_operacion" data-field="operacion" value="'+o+'"'+(sel?' checked':'')+' style="accent-color:#31455C;"><span style="font-size:11.5px;font-weight:600;color:'+(sel?'#31455C':'#5A6A7A')+';">'+OPS_LABELS[o]+'</span></label>';}).join('');

  var locH='<div style="display:flex;gap:10px;align-items:flex-end;"><div style="flex:1;"><label class="fl">Localidad</label>'+selectHtml('localidad',f.localidad,LOCALIDADES)+'</div><div style="padding-bottom:9px;">'+toggleHtml('rf_todasLocalidades',f.todasLocalidades,'Todas las localidades')+'</div></div>';

  var q=(f.barrioSearch||'').toLowerCase().trim();
  var barrioPool=q?BARRIOS.filter(function(b){return b.toLowerCase().indexOf(q)!==-1;}):BARRIOS.slice(0,8);
  var barriosChipsH=barrioPool.map(function(b){var sel=f.zonas.indexOf(b)!==-1;return '<label class="zchip'+(sel?' sel':'')+'" data-zone="'+esc(b)+'" style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;">'+(sel?'☑':'☐')+' '+esc(b)+'</label>';}).join('');
  var moreBtn=(!q&&BARRIOS.length>8)?'<div style="font-size:10px;color:#B0B8C1;margin-top:4px;">'+(BARRIOS.length-8)+' más — escribí para buscar</div>':'';

  var CARACS=[{k:'garage',l:'Garage'},{k:'patio',l:'Patio'},{k:'lavadero',l:'Lavadero'},{k:'pileta',l:'Pileta'},{k:'quincho',l:'Quincho'},{k:'parrilla',l:'Parrilla'},{k:'amoblado',l:'Amoblado'}];
  var caracsH=CARACS.map(function(c){var sel=f[c.k];return '<label class="zchip'+(sel?' sel':'')+'" data-toggle="rf_'+c.k+'" style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;">'+(sel?'☑':'☐')+' '+esc(c.l)+'</label>';}).join('');

  var showDorm = f.tipoBuscado.length===0 || f.tipoBuscado.some(function(t){return t!=='Lote'&&t!=='Campo';});
  var condH='';
  if(f.tipoBuscado.indexOf('Lote')!==-1||f.tipoBuscado.indexOf('Campo')!==-1){
    condH='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;"><div><label class="fl">Superficie mínima m²</label>'+inputHtml('superficieMin','number',f.superficieMin,'0')+'</div><div><label class="fl">Frente</label>'+inputHtml('frente','number',f.frente,'0')+'</div><div><label class="fl">Fondo</label>'+inputHtml('fondo','number',f.fondo,'0')+'</div></div><div style="margin-top:8px;">'+toggleHtml('rf_esquina',f.esquina,'Esquina')+'</div>';
    if(f.tipoBuscado.indexOf('Campo')!==-1){condH+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;"><div><label class="fl">Hectáreas</label>'+inputHtml('hectareas','number',f.hectareas,'0')+'</div><div><label class="fl">Aptitud</label>'+inputHtml('aptitud','text',f.aptitud,'Agrícola/Ganadera')+'</div></div><div style="display:flex;gap:14px;margin-top:8px;">'+toggleHtml('rf_alambrado',f.alambrado,'Alambrado')+toggleHtml('rf_agua',f.agua,'Agua')+'</div>';}
  } else if(f.tipoBuscado.indexOf('Departamento')!==-1||f.tipoBuscado.indexOf('PH')!==-1){
    condH='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"><div><label class="fl">Piso</label>'+inputHtml('piso','text',f.piso,'')+'</div><div><label class="fl">Expensas máx.</label>'+inputHtml('expensas','number',f.expensas,'0')+'</div></div><div style="display:flex;gap:14px;margin-top:8px;">'+toggleHtml('rf_ascensor',f.ascensor,'Ascensor')+toggleHtml('rf_balcon',f.balcon,'Balcón')+'</div>';

  }

  var summaryH='<div class="card" style="position:sticky;top:0;"><div style="padding:12px 16px;border-bottom:1px solid #F0EBE4;font-size:12px;font-weight:700;color:#1C2B39;">Resumen</div><div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:11.5px;"><div><span style="color:#8A9AAA;">Cliente:</span> <b>'+esc(f.nombre||'—')+'</b></div><div><span style="color:#8A9AAA;">Busca:</span> <b>'+esc(f.tipoBuscado.join(', ')||'—')+'</b></div><div><span style="color:#8A9AAA;">Operación:</span> <b>'+esc(f.operacion)+'</b></div><div><span style="color:#8A9AAA;">Localidad:</span> <b>'+(f.todasLocalidades?'Todas':esc(f.localidad))+'</b></div><div><span style="color:#8A9AAA;">Zona:</span> <b>'+(f.zonas.length?esc(f.zonas.join(', ')):'—')+'</b></div><div><span style="color:#8A9AAA;">Presupuesto:</span> <b>'+esc(f.moneda)+' '+fmt(f.presupuestoMin)+' - '+fmt(f.presupuestoMax)+'</b></div>'+(showDorm?'<div><span style="color:#8A9AAA;">Dormitorios:</span> <b>'+esc(f.dormitoriosMin)+'</b></div><div><span style="color:#8A9AAA;">Garage:</span> <b>'+(f.garage?'Sí':'No')+'</b></div><div><span style="color:#8A9AAA;">Patio:</span> <b>'+(f.patio?'Sí':'No')+'</b></div>':'')+'</div></div>';

  var blkObligatorio='<div class="card"><div style="padding:14px 20px;border-bottom:1px solid #F0EBE4;display:flex;align-items:center;gap:9px;"><div class="blk" style="background:#D40A8C;">1</div><div><div style="font-size:13px;font-weight:700;color:#1C2B39;">Criterios obligatorios</div><div style="font-size:10px;color:#9AA5B0;">Impactan más en el Match</div></div></div><div style="padding:16px 20px;display:flex;flex-direction:column;gap:14px;"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;"><div><label class="fl">Nombre</label>'+inputHtml('nombre','text',f.nombre,'Nombre completo')+'</div><div><label class="fl">Teléfono</label>'+inputHtml('telefono','tel',f.telefono,'+54 11 XXXX-XXXX')+'</div><div><label class="fl">ID cliente existente</label>'+inputHtml('clienteId','number',f.clienteId,'Ej: 12','min="1"')+'</div></div><div style="font-size:10px;color:#B0B8C1;margin-top:-6px;">El backend todavía no tiene alta de clientes desde el panel (backlog Tier 2 #7) — necesitás el ID numérico de un cliente ya cargado en /clients.</div><div><label class="fl">Tipo de propiedad</label><div style="display:flex;flex-wrap:wrap;gap:8px;">'+tipoIconsH+'</div></div><div><label class="fl">Operación</label><div style="display:flex;gap:8px;">'+opsH+'</div></div>'+locH+'<div><label class="fl">Barrios</label>'+inputHtml('barrioSearch','text',f.barrioSearch,'Buscar barrio...')+'<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;opacity:'+(f.todasLocalidades?'.4':'1')+';pointer-events:'+(f.todasLocalidades?'none':'auto')+';">'+barriosChipsH+'</div>'+moreBtn+'</div>'+'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;"><div><label class="fl">Presupuesto desde</label>'+inputHtml('presupuestoMin','number',f.presupuestoMin,'0')+'</div><div><label class="fl">Presupuesto hasta</label>'+inputHtml('presupuestoMax','number',f.presupuestoMax,'0')+'</div><div><label class="fl">Moneda</label>'+selectHtml('moneda',f.moneda,['USD','ARS'])+'</div></div><div style="display:flex;gap:16px;">'+toggleHtml('rf_aceptaFuera10',f.aceptaFuera10,'Acepta propiedades hasta 10% fuera del presupuesto')+toggleHtml('rf_aptoCredito',f.aptoCredito,'Apto crédito')+'</div>'+warnH+'</div></div>';

  var stepsArr=[blkObligatorio,blkImportante,blkPreferencias];

var MATCH_W = { tipo:20, op:10, precio:20, zona:15, localidad:10, dormitorios:10, banos:5, garage:5, patio:5 };

function calcScore(prop, req) {
  var c = {}, max = {}, w = MATCH_W;

  c.tipo = (req.tipoBuscado.indexOf('Cualquiera')!==-1 || req.tipoBuscado.indexOf(prop.tipo)!==-1) ? w.tipo : 0; max.tipo = w.tipo;
  c.op   = (req.operacion==='Ambos' || prop.operacion === req.operacion) ? w.op : 0; max.op = w.op;

  var pw  = req.soloPorValor ? 35 : w.precio;
  var pct = req.presupuestoMax > 0 ? prop.precio / req.presupuestoMax : null;
  if (pct != null) {
    c.precio = pct >= 0.7 && pct <= 1 ? pw
      : pct > 1 && pct <= 1.10 ? Math.round(pw * 0.7)
      : pct > 1.10 && pct <= 1.25 ? Math.round(pw * 0.4)
      : pct >= 0.5 && pct < 0.7 ? Math.round(pw * 0.5)
      : 0;
    max.precio = pw;
  } else { c.precio = 0; max.precio = 0; }

  if (!req.soloPorValor && req.zonas.length > 0) {
    var zl = zoneLevel(prop.zona, req.zonas);
    c.zona = zl==='exact' ? w.zona : zl==='group' ? Math.round(w.zona*0.5) : 0;
    max.zona = w.zona;
  } else { c.zona = 0; max.zona = 0; }

  if (!req.todasLocalidades && req.localidad) {
    var pl=(prop.localidad||'').trim().toLowerCase(), rl=req.localidad.trim().toLowerCase();
    c.localidad = pl===rl ? w.localidad : 0;
    max.localidad = w.localidad;
  } else { c.localidad = 0; max.localidad = 0; }

  if (req.dormitoriosMin > 0) {
    var diff = prop.dormitorios - req.dormitoriosMin;
    c.dormitorios = diff >= 0 ? w.dormitorios : diff === -1 ? Math.round(w.dormitorios * 0.5) : 0;
    max.dormitorios = w.dormitorios;
  } else { c.dormitorios = 0; max.dormitorios = 0; }

  if (req.banosMin > 0) {
    var diffB = prop.banos - req.banosMin;
    c.banos = diffB >= 0 ? w.banos : diffB === -1 ? Math.round(w.banos * 0.5) : 0;
    max.banos = w.banos;
  } else { c.banos = 0; max.banos = 0; }

  c.garage = req.garage ? (prop.garage ? w.garage : 0) : 0; max.garage = req.garage ? w.garage : 0;
  c.patio  = req.patio  ? (prop.patio  ? w.patio  : 0) : 0; max.patio  = req.patio  ? w.patio  : 0;

  var maxTotal = Object.keys(max).reduce(function(a,k){ return a + max[k]; }, 0);
  var earned   = Object.keys(c).reduce(function(a,k){ return a + c[k]; }, 0);

  var BONUS_W = { pileta:2, quincho:2, lavadero:2, parrilla:2, amoblado:2, ascensor:1, balcon:1, esquina:1, agua:1, alambrado:1 };
  var bonus = 0;
  Object.keys(BONUS_W).forEach(function(k){ if (req[k] && prop[k]) bonus += BONUS_W[k]; });

  var total = maxTotal > 0 ? Math.round(((earned + bonus) / maxTotal) * 100) : 0;

  return { total: Math.min(total, 100), c: c, max: max, pct: pct };
}

    dormitorios: f.dormitorios!=='' ? Number(f.dormitorios) : undefined,
    banos: f.banos!=='' ? Number(f.banos) : undefined,
    garage: f.garage ? (Number(f.cantGarage)||1) : 0,
    superficie: f.supCubierta!=='' ? Number(f.supCubierta) : (f.supTerreno!=='' ? Number(f.supTerreno) : undefined),
    observaciones: f.obs || undefined,
    // — estimadas (columnas extendidas de la migración, ver comentario en normProps) —
    propietario: f.propietario || undefined, telefono: f.telefono || undefined,
    contacto_operativo: f.contactoOperativo || undefined, exclusividad: !!f.exclusividad,
    inmobiliaria: f.inmobiliaria || undefined, apto_credito: !!f.aptoCredito,
    ambientes: f.ambientes!=='' ? Number(f.ambientes) : undefined,
    sup_terreno_m2: f.supTerreno!=='' ? Number(f.supTerreno) : undefined,
    sup_cubierta_m2: f.supCubierta!=='' ? Number(f.supCubierta) : undefined,
    estado_general: f.estadoGeneral || undefined, entre_calles: f.entreCalles || undefined,
    piso: f.piso || undefined, depto: f.depto || undefined,
    patio: !!f.patio, tipo_patio: f.patio ? f.tipoPatio : undefined,
    lavadero: !!f.lavadero, pileta: !!f.pileta, quincho: !!f.quincho, parrilla: !!f.parrilla,
    amoblado: !!f.amoblado, ascensor: !!f.ascensor, balcon: !!f.balcon, esquina: !!f.esquina,
    agua: !!f.agua, alambrado: !!f.alambrado, foto_url: f.fotoUrl || undefined,
    partida: f.partida || undefined, acepta_permutas: !!f.aceptaPermutas
  };
  var btn=document.querySelector('[data-action="save-propForm"]');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';btn.style.opacity='.6';}
  var req = editing
    ? apiFetch('/properties/'+editing, { method:'PUT', body:JSON.stringify(body) })
    : apiFetch('/properties', { method:'POST', body:JSON.stringify(body) });
  req.then(function(saved){
    var id = editing || String((saved&&saved.id!=null)?saved.id:'');
    if(editing){
      var idx=STATE.props.findIndex(function(x){return x.id===id;});
      if(idx!==-1) STATE.props[idx]=Object.assign({},f,{id:id});
    } else {
      STATE.props.unshift(Object.assign({},f,{id:id}));
      STATE.newPropIds.push(id);
    }
    STATE.editingPropId=null;
    STATE.propForm=emptyPF();
    showToast(editing?'✓ '+id+' actualizada':'✓ Propiedad '+id+' guardada');
    renderNav();reRender();
  }).catch(function(e){
    if(btn){btn.disabled=false;btn.textContent='Guardar Propiedad';btn.style.opacity='';}
    showToast('Error: '+e.message);
  });
}
function editProp(id){
  var p=STATE.props.filter(function(x){return x.id===id;})[0];
  if(!p) return;
  STATE.editingPropId=id;
  STATE.propForm=Object.assign({},emptyPF(),p);
  navigate('propForm');
}
function editReq(id){
  var r=STATE.reqs.filter(function(x){return x.id===id;})[0];
  if(!r) return;
  STATE.editingReqId=id;
  STATE.reqForm=Object.assign({},emptyRF(),r,{zonas:r.zonas.slice(),tipoBuscado:r.tipoBuscado.slice(),localidad:r.localidad||'Olavarría',fechaPedido:r.fechaPedido||new Date().toISOString().split('T')[0]});
  STATE.reqFormStep=1;
  navigate('reqForm');
}
function saveReqForm(){
  var f=STATE.reqForm;
  if(!f.nombre){showToast('Completá el nombre del cliente');return;}
  if(!f.clienteId){showToast('Falta el ID de cliente — el backend todavía no crea clientes desde acá (backlog Tier 2 #7)');return;}
  var editing=STATE.editingReqId;
  var body={
    cliente_id: Number(f.clienteId),
    operacion: f.operacion==='Ambos' ? 'Venta' : f.operacion,
    tipo_propiedad: f.tipoBuscado.filter(function(t){return t!=='Cualquiera';}).map(function(t){return t.toLowerCase();}),
    presupuesto_min: f.presupuestoMin!=='' ? Number(f.presupuestoMin) : undefined,
    presupuesto_max: f.presupuestoMax!=='' ? Number(f.presupuestoMax) : undefined,
    moneda: f.moneda,
    localidad: f.todasLocalidades ? undefined : (f.localidad || undefined),
    zonas: f.zonas.length ? f.zonas : undefined,
    dormitorios_min: f.dormitoriosMin || undefined,
    banos_min: f.banosMin || undefined
  };
  var req = editing
    ? apiFetch('/requirements/'+editing, { method:'PUT', body:JSON.stringify(body) })
    : apiFetch('/requirements', { method:'POST', body:JSON.stringify(body) });
  req.then(function(saved){
    var id = editing || String((saved&&saved.id!=null)?saved.id:'');
    if(editing){
      var idx=STATE.reqs.findIndex(function(x){return x.id===id;});
      if(idx!==-1) STATE.reqs[idx]=Object.assign({},f,{zonas:f.zonas.slice(),id:id});
      showToast('✓ '+id+' actualizado');
    } else {
      STATE.reqs.push(Object.assign({},f,{zonas:f.zonas.slice(),id:id}));
      showToast('✓ Requerimiento '+id+' guardado');
    }
    STATE.editingReqId=null;
    STATE.reqForm=emptyRF();STATE.reqFormStep=1;renderNav();reRender();
  }).catch(function(e){
    showToast('Error: '+e.message+(editing?' (la edición de requerimientos puede no estar soportada todavía por el backend)':''));
  });
}
function unsendMatch(propId){
  delete STATE.sentMatches[propId+'_'+STATE.selectedReqId];
  saveSentMatches();
  showToast(propId+' — desmarcada');
  var area=document.getElementById('content-area');var st=area.scrollTop;area.innerHTML=renderMatch();area.scrollTop=st;
}
function markVendida(id){
  var p=STATE.props.filter(function(x){return x.id===id;})[0];
  if(!p||p.estadoComercial==='Vendido') return;
  showModal({title:'Marcar como vendida',body:'¿Confirmás que '+id+' fue vendida?',confirmText:'Sí, marcar vendida',onConfirm:function(){
    apiFetch('/properties/'+id, { method:'PUT', body:JSON.stringify({ estado_comercial:'Vendido', publicada:false }) })
      .then(function(){ p.estadoComercial='Vendido';p.activoMatch=false; showToast('✓ '+id+' vendida'); render(); })
      .catch(function(e){ showToast('Error: '+e.message); });
  }});
}
function markAlquilada(id){
  var p=STATE.props.filter(function(x){return x.id===id;})[0];
  if(!p||p.estadoComercial==='Alquilado') return;
  showModal({title:'Marcar como alquilada',inputs:[{id:'fecha',label:'Fecha fin de contrato',type:'date'}],confirmText:'Confirmar',onConfirm:function(vals){
    if(!vals.fecha) return;
    apiFetch('/properties/'+id, { method:'PUT', body:JSON.stringify({ estado_comercial:'Alquilado', publicada:false }) })
      .then(function(){
        p.estadoComercial='Alquilado';p.activoMatch=false;p.fechaFinContrato=vals.fecha;
        showToast('✓ '+id+' alquilada (la fecha de fin de contrato solo se guarda en este panel — el backend no tiene esa columna todavía)');
        render();
      })
      .catch(function(e){ showToast('Error: '+e.message); });
  }});
}
function checkReactivaciones(){
  var hoy=new Date().toISOString().split('T')[0];
  STATE.props.forEach(function(p){
    if(p.estadoComercial==='Alquilado'&&p.fechaFinContrato&&p.fechaFinContrato<hoy){
      p.estadoComercial='Disponible';p.activoMatch=true;p.fechaFinContrato='';
      apiFetch('/properties/'+p.id, { method:'PUT', body:JSON.stringify({ estado_comercial:'Disponible' }) }).catch(function(){});
    }
  });
}
function saveSentMatches(){ try{ localStorage.setItem('lebrero_sent_matches', JSON.stringify(STATE.sentMatches)); }catch(e){} }
function sendMatch(propId){
  var req=STATE.reqs.filter(function(r){return r.id===STATE.selectedReqId;})[0];
  var prop=STATE.props.filter(function(p){return p.id===propId;})[0];
  if(req&&prop){
    var nombre=req.nombre.split(' ')[0];
    var msg='Hola '+nombre+'! Encontramos algo que puede interesarte: '+prop.tipo+' en '+(prop.direccion||prop.barrio)+', '+fmtPrice(prop.precio,prop.moneda)+'. Te paso más info o coordinamos para verla?';
    var phone=(req.telefono||'').replace(/\D/g,'');
    window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
  }
  STATE.sentMatches[propId+'_'+STATE.selectedReqId]=true;
  saveSentMatches();
  showToast(propId+' — propuesta enviada por WhatsApp');
  var area=document.getElementById('content-area');var st=area.scrollTop;area.innerHTML=renderMatch();area.scrollTop=st;
}

/* ─── TOAST / MODAL ──────────────────────────────────────────────── */
var _toastTimer=null;
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.style.display='block';el.style.animation='none';void el.offsetWidth;el.style.animation='toastIn .3s ease';if(_toastTimer) clearTimeout(_toastTimer);_toastTimer=setTimeout(function(){el.style.display='none';},3000);}

function showModal(o){
  var ov=document.getElementById('modal-overlay');
  var inputsH=(o.inputs||[]).map(function(f){
    if(f.type==='select'){
      var opts=(f.options||[]).map(function(op){var v=typeof op==='object'?op.value:op;var l=typeof op==='object'?op.label:op;return '<option value="'+esc(v)+'">'+esc(l)+'</option>';}).join('');
      return '<div style="margin-bottom:10px;"><label class="fl">'+esc(f.label)+'</label><select class="fs" id="modal_'+f.id+'">'+opts+'</select></div>';
    }
    return '<div style="margin-bottom:10px;"><label class="fl">'+esc(f.label)+'</label><input class="fi" id="modal_'+f.id+'" type="'+(f.type||'text')+'" value="'+esc(f.default||'')+'" placeholder="'+esc(f.placeholder||'')+'"></div>';
  }).join('');
  ov.innerHTML='<div class="modal-box anim"><div style="font-size:15px;font-weight:700;color:#1C2B39;margin-bottom:6px;">'+esc(o.title)+'</div>'+(o.body?'<div style="font-size:12px;color:#5A6A7A;margin-bottom:12px;">'+esc(o.body)+'</div>':'')+inputsH+'<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;"><button class="btn-s" id="modal-cancel">'+esc(o.cancelText||'Cancelar')+'</button><button class="btn-p" id="modal-ok">'+esc(o.confirmText||'Confirmar')+'</button></div></div>';
  ov.style.display='flex';
  document.getElementById('modal-cancel').onclick=function(){ov.style.display='none';};
  document.getElementById('modal-ok').onclick=function(){
    var vals={};
    (o.inputs||[]).forEach(function(f){var el=document.getElementById('modal_'+f.id);vals[f.id]=el?el.value:'';});
    ov.style.display='none';
    o.onConfirm(vals);
  };
}

/* ─── LOGIN GATE + INIT ───
   Antes: /dashboard (valida token) → /properties + /requirements (datos).
   Ahora: una sola tanda — /properties valida Y trae datos a la vez. ─── */
function loadData(onError){
  Promise.all([ apiFetch('/properties'), apiFetch('/requirements'), apiFetch('/clients') ]).then(function(res){
    document.getElementById('login-gate').style.display='none';
    var clientsMap={};
    (res[2]||[]).forEach(function(c){ clientsMap[String(c.id)] = c; });
    STATE.props = normProps(res[0], clientsMap);
    STATE.reqs  = normReqs(res[1]);
    try{ STATE.sentMatches = JSON.parse(localStorage.getItem('lebrero_sent_matches')||'{}'); }catch(e){ STATE.sentMatches={}; }
    var firstActive = STATE.reqs.filter(function(r){return r.estado==='Buscando';})[0];
    STATE.selectedReqId = firstActive ? firstActive.id : (STATE.reqs[0]?STATE.reqs[0].id:'');
    localStorage.setItem('lebrero_admin_token', TOKEN);
    checkReactivaciones();
    render();
  }).catch(function(e){
    if (onError) onError(e); else alert('No se pudieron cargar los datos desde la API: ' + e.message);
  });
}
document.addEventListener('DOMContentLoaded', function(){
  if (TOKEN) {
    loadData(function(){ TOKEN=null; localStorage.removeItem('lebrero_admin_token'); });
  }
  document.getElementById('token-submit').addEventListener('click', function(){
    var val = document.getElementById('token-input').value.trim();
    var err = document.getElementById('token-err');
    if (!val) { err.textContent = 'Ingresá un token.'; return; }
    TOKEN = val;
    err.textContent = 'Verificando...';
    loadData(function(){
      err.textContent = 'Token incorrecto o sin conexión.';
      TOKEN = null;
    });
  });
  document.getElementById('token-input').addEventListener('keydown', function(e){
    if (e.key==='Enter') document.getElementById('token-submit').click();
  });
});
</script>
