<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada | Lebrero Propiedades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#142938; --cream:#f3f0e8; --paper:#fbfaf7;
  --pink:#d41478; --teal-dark:#315f63; --line:#d9d9d3; --muted:#6c777c;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif;text-align:center;overflow-x:clip}
a{text-decoration:none;color:inherit}
.wrap{padding:40px}
.eyebrow{font-size:10px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;color:var(--pink);margin:0 0 13px}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:500;font-size:clamp(60px,10vw,120px);margin:0}
p{color:var(--muted);font-size:14px;max-width:420px;margin:14px auto 30px}
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 22px;border:1px solid var(--ink);background:var(--ink);color:#fff;
  font-size:12px;font-weight:700;transition:transform .3s var(--ease)
}
.btn:hover{transform:translateY(-2px)}
img.logo{width:150px;margin:0 auto 30px}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/assets/images/logo-lebrero.webp" alt="Lebrero Propiedades">
  <p class="eyebrow">Error 404</p>
  <h1>404</h1>
  <p>La página que buscás no existe o fue movida.</p>
  <a class="btn" href="/">Volver al inicio</a>
</div>
</body>
</html>
